# ============================================================================
# VAE Configuration - ALPHA BAND ONLY
# ============================================================================

# Paths
paths:
  phases_dir: "/media/storage_hdd/dmt_fz/fwd-inv-stc"
  output_dir: "/media/storage_hdd/dmt_fz/machine_learning/autoencoder/output_alpha"
  dataset_cache: "/media/storage_hdd/dmt_fz/machine_learning/clf/data/cache"
  checkpoints: "/media/storage_hdd/dmt_fz/machine_learning/autoencoder/output_alpha/checkpoints"
  tensorboard: "/media/storage_hdd/dmt_fz/machine_learning/autoencoder/output_alpha/runs"
  activations_dir: "/media/storage_hdd/dmt_fz/machine_learning/autoencoder/output_alpha/activations"

# Data configuration - ALPHA ONLY
data:
  conditions: ["DMT", "EC", "EO"]
  bands: ["Alpha"]  # ONLY ALPHA
  use_stc: false
  
  graph:
    fully_connected: true
    edge_threshold: 0.3
    edge_threshold_percentile: null
    max_edges_per_node: null
    self_loops: false
    directed: false
  
  node_features:
    use_phase_stats: true
    use_amplitude_stats: true
    use_temporal_complexity: true
    use_network_label: true
  
  graph_features:
    use_kuramoto: true
    use_global_sync: true
    use_topology: true
  
  split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
    stratify: true
    random_state: 42
    group_by_subject: true

# Model - same as original
model:
  name: "BrainStateVAE"
  
  encoder:
    conv_type: "gatv2"
    hidden_dim: 64
    num_gat_layers: 3
    num_attention_heads: 4
    cheby_k: 3
    dropout: 0.2
    attention_dropout: 0.1
    use_edge_attr: true
    concat_heads: true
    negative_slope: 0.2
    use_skip_connections: true
  
  latent:
    dim: 32  # Smaller latent for single band
  
  decoder:
    hidden_dims: [128, 64]
    reconstruct_edges: true
    activation: "leaky_relu"
    dropout: 0.1
  
  pooling:
    method: "mean"

# Loss
loss:
  reconstruction:
    node_weight: 0.3
    edge_weight: 1.0
    type: "mse"
  
  kl:
    weight: 0.01
    annealing:
      enabled: true
      start: 0.0
      end: 0.05
      epochs: 30
      type: "linear"
  
  free_bits: 0.1

# Training - faster for single band
training:
  num_epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 1e-5
  optimizer: "adamw"
  
  scheduler:
    type: "cosine"
    patience: 10
    factor: 0.5
    min_lr: 1e-6
  
  early_stopping:
    patience: 20
    min_delta: 0.0001
    monitor: "val_loss"
  
  gradient_clipping:
    enabled: true
    max_norm: 0.5

# Logging
logging:
  level: "INFO"
  tensorboard: true
  save_frequency: 10
  log_frequency: 1
  
  tensorboard_extras:
    latent_space: true
    reconstructions: true
    attention_weights: true
    kl_per_dim: true
    gradient_norms: true

visualization:
  plot_training_curves: true
  plot_latent_space: true
  plot_reconstructions: true
  num_examples_to_visualize: 10
  latent_method: "tsne"

# Extraction
extraction:
  layers_to_extract:
    - "encoder.conv_0"
    - "encoder.conv_1"
    - "encoder.conv_2"
    - "latent"
    - "pooled"
  output_format: "pkl"
  save_attention_weights: true
  save_per_subject: true
  clustering_compatible: true

# Hardware
seed: 42
deterministic: true
device: "cuda"
num_workers: 4
dataset_workers: 4
pin_memory: true





data:
  bands:
  - Alpha
  conditions:
  - DMT
  - EC
  graph:
    directed: false
    edge_threshold: 0.3
    edge_threshold_percentile: null
    fully_connected: true
    max_edges_per_node: null
    self_loops: false
  graph_features:
    use_global_sync: true
    use_kuramoto: true
    use_topology: true
  node_features:
    use_amplitude_stats: true
    use_network_label: true
    use_phase_stats: true
    use_temporal_complexity: true
  split:
    group_by_subject: true
    random_state: 42
    stratify: true
    test_ratio: 0.15
    train_ratio: 0.7
    val_ratio: 0.15
  use_stc: false
dataset_workers: 24
deterministic: true
device: cuda
evaluation:
  average: macro
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - confusion_matrix
  save_attention_weights: true
  save_predictions: true
logging:
  level: INFO
  log_frequency: 1
  save_frequency: 10
  tensorboard: true
model:
  architecture:
    attention_dropout: 0.2
    cheby_k: 3
    concat_heads: true
    conv_type: gatv2
    dropout: 0.422465
    hidden_dim: 512
    negative_slope: 0.2
    num_attention_heads: 4
    num_gat_layers: 2
    use_edge_attr: true
    use_skip_connections: true
  mlp:
    activation: relu
    dropout: 0.520941
    hidden_dims:
    - 256
    - 128
    use_batch_norm: true
  name: BrainStateGNN
  pooling:
    method: mean
    pooling_ratio: 0.5
multiband:
  enabled: true
  fusion: late
  per_band_weights: null
num_workers: 24
paths:
  checkpoints: hyperparam_search/search_20251125_170924/exp000_h512_l2_heads4_lr1e-03/checkpoints
  dataset_cache: /media/storage_hdd/dmt_fz/machine_learning/clf/data/cache
  output_dir: hyperparam_search/search_20251125_170924/exp000_h512_l2_heads4_lr1e-03/output
  phases_dir: /media/storage_hdd/dmt_fz/fwd-inv-stc
  tensorboard: hyperparam_search/search_20251125_170924/exp000_h512_l2_heads4_lr1e-03/tensorboard
pin_memory: true
seed: 42
training:
  batch_size: 32
  class_weights:
  - 0.92
  - 1.1
  early_stopping:
    min_delta: 0.001
    patience: 50
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  label_smoothing: 0.0
  learning_rate: 0.001142
  num_epochs: 80
  optimizer: adam
  scheduler:
    factor: 0.5
    min_lr: 1e-6
    patience: 15
    type: reduce_on_plateau
  weight_decay: 1.2e-05
visualization:
  num_examples_to_visualize: 10
  plot_attention_heatmaps: true
  plot_confusion_matrix: true
  plot_graph_statistics: true
  plot_training_curves: true
